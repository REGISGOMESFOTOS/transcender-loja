<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Transcender Camisas — catálogo virtual. Pague com Pix ou cartão, ou finalize pelo WhatsApp.">
<meta name="theme-color" content="#1a1f2c">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Transcender Camisas</title>
<style id="page-style">
/* Layout: vitrine em grade de etiquetas de roupa; carrinho em gaveta lateral; painel do lojista em abas */
:root{
  --bg:#f4f4f0; --surface:#ffffff; --ink:#1c2233; --muted:#5f6779; --line:#dcdedf;
  --accent:#e4b11f; --on-accent:#1c2233; --sale:#b23a2a; --ok:#2f7d4f; --shade:rgba(20,24,36,.45);
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
  --banner:#1a1f2c; --banner-ink:#f3ecda; --banner-muted:#b9b2a0; --pearl:#e9dfc2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1b1f2b; --ink:#eef0f5; --muted:#9ba3b6; --line:#2d3342;
  --accent:#e9bb35; --on-accent:#171b26; --sale:#ff8572; --ok:#6fcf97; --shade:rgba(0,0,0,.6); --banner:#0c0f16; --banner-ink:#f3ecda; --banner-muted:#a9a290; --pearl:#e9dfc2; color-scheme:dark}}
:root[data-theme="dark"]{
  --banner:#0c0f16; --banner-muted:#a9a290;
  --bg:#12151d; --surface:#1b1f2b; --ink:#eef0f5; --muted:#9ba3b6; --line:#2d3342;
  --accent:#e9bb35; --on-accent:#171b26; --sale:#ff8572; --ok:#6fcf97; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.yellow{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--sale);border-color:var(--sale);background:transparent}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:.88rem}
.count{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:.78rem;min-width:22px;padding:0 6px;text-align:center;font-weight:700}

/* Vitrine */
.hero{padding-block:28px 8px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--muted);max-width:52ch;margin:.4rem 0 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-block:18px;align-items:center}
.ffilters{display:grid;gap:8px;margin:-6px 0 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);min-width:68px}
.fsize{min-width:42px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-weight:700;font-family:var(--display);font-size:.88rem}
.fcolor{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px 4px 5px;font-weight:600;font-size:.85rem}
.fcolor .dot{width:16px;height:16px}
.fpick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px 5px 8px;font-weight:600;font-size:.88rem}
.fpick .dot{width:16px;height:16px}
.fpick[aria-expanded="true"]{border-color:var(--ink)}
.fpick .chev{font-size:.62rem;color:var(--muted);margin-left:2px}
.fcolors{padding-left:74px}
@media (max-width:520px){.fcolors{padding-left:0}}
.fsize[aria-pressed="true"],.fcolor[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
@media (max-width:520px){.flabel{min-width:100%}}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 200px;min-width:0;max-width:280px;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-block:6px 120px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}.search{max-width:none;margin-left:0}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;position:relative}
.card:hover{border-color:var(--ink)}
.pic{aspect-ratio:4/5;width:100%;max-width:100%;background:color-mix(in srgb,var(--line) 45%,var(--surface));display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic svg{width:62%;height:auto}
.card .info{padding:12px 14px 14px;display:grid;gap:4px}
.card .name{font-weight:700;line-height:1.3}
.cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.price{font-family:var(--display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:500;font-size:.85rem;margin-right:6px;font-family:var(--body)}
.price .now{color:var(--sale)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.tag{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--on-accent);font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.tag.ex{left:auto;right:10px;background:var(--ink);color:var(--bg)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:var(--r)}

/* Barra do carrinho */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.cartbar .btn{pointer-events:auto;padding:13px 22px;box-shadow:0 8px 24px var(--shade);font-size:1rem}

/* Modal e gaveta */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;justify-content:center;align-items:flex-end}
@media (min-width:760px){.shade{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:880px;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet{border-radius:18px}}
.shade.side{justify-content:flex-end;align-items:stretch}
.shade.side .sheet{max-width:440px;height:100%;max-height:100%;border-radius:0;display:block}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.x{border:none;background:transparent;font-size:1.6rem;line-height:1;padding:4px 8px;color:var(--muted)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:16px}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
.detail .pic{border-radius:var(--r)}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs button{width:58px;flex:0 0 58px;aspect-ratio:4/5;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:none}
.thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.dside{display:grid;gap:16px;align-content:start;min-width:0}
.dside h2{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.desc{color:var(--muted);white-space:pre-line;margin:0}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin-bottom:6px;display:block}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:.9rem}
.sw .dot{width:20px;height:20px}
.sw[aria-pressed="true"],.size[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.size{min-width:48px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:700;font-family:var(--display)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.qty button{border:none;background:none;width:36px;height:36px;font-size:1.1rem}
.qty span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hint{font-size:.85rem;color:var(--muted)}

.lines{padding:8px 16px}
html.lock,html.lock body{overflow:hidden}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);align-items:start}
.line .pic{border-radius:8px}
.line .meta{min-width:0}
.line .meta b{display:block;line-height:1.3}
.line .meta small{color:var(--muted)}
.line .right{text-align:right;display:grid;gap:6px;justify-items:end}
.link{border:none;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}
.checkout{padding:16px;border-top:1px solid var(--line);display:grid;gap:12px;background:var(--surface)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.field{display:grid;gap:4px}
.field span{font-size:.85rem;font-weight:600}
.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea.in{resize:vertical;min-height:64px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem;background:var(--bg)}
.err{color:var(--sale);font-size:.85rem;margin:0}
.wa{background:#1f9d55;border-color:#1f9d55;color:#fff;padding:13px 18px;font-size:1rem}
.msgbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;font-size:.82rem;max-height:160px;overflow:auto}

/* Painel */
.admin{padding-block:20px 80px;display:grid;gap:18px}
.abar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.status{display:flex;align-items:center;gap:8px;font-weight:600}
.status i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.status.dirty i{background:var(--accent)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.row .pic{border-radius:8px}
.row .meta{min-width:0}
.row .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta small{color:var(--muted)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.off{opacity:.5}
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.colorrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colorrow input[type=color]{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--bg)}
.removable{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 6px;background:var(--bg);font-weight:600;font-size:.88rem}
.removable button{border:none;background:none;color:var(--muted);font-size:1.1rem;line-height:1;padding:0 4px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photo{width:92px;position:relative}
.photo .pic{border-radius:10px}
.photo .pb{display:flex;justify-content:space-between;margin-top:4px}
.photo .pb button{border:none;background:none;font-size:.78rem;color:var(--muted);padding:2px}
.upload{width:92px;aspect-ratio:4/5;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;padding:6px}
.upload input{display:none}
.meter{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.note{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:12px;padding:10px 14px;font-size:.9rem}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 8px 24px var(--shade);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet.enter{animation:up .22s ease-out}.shade.side .sheet.enter{animation:inr .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}@keyframes inr{from{transform:translateX(30px);opacity:.6}}}
.card.soldout .pic{opacity:.45}
.tag.out{background:var(--muted);color:var(--surface)}
.size[disabled],.sw[disabled]{opacity:.38;text-decoration:line-through;cursor:not-allowed}
.qty button[disabled]{opacity:.3;cursor:not-allowed}
.ship{display:inline-flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.92rem;margin-top:16px;max-width:100%}
.ship b{font-weight:700}
.ship span{color:var(--muted)}
.sums{display:grid;gap:4px;font-variant-numeric:tabular-nums;font-size:.95rem}
.sums div{display:flex;justify-content:space-between;gap:12px}
.free{color:var(--ok);font-weight:700}
.goal{font-size:.88rem;margin:0}
.goal .meter{margin-top:6px}
.warn{color:var(--sale);font-size:.82rem;font-weight:600;display:block}
.low{color:var(--sale);font-weight:600}
.scroll{overflow-x:auto}
.stk{border-collapse:collapse;font-variant-numeric:tabular-nums}
.stk th,.stk td{padding:4px 6px;text-align:center;font-size:.85rem}
.stk th:first-child,.stk td:first-child{text-align:left;white-space:nowrap}
.stk input{width:66px;text-align:center;padding:7px 6px}
.otable{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.otable td,.otable th{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.otable th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.03em;border:1px solid var(--line);white-space:nowrap}
.st.wait{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.st.paid{color:var(--ok);border-color:var(--ok)}
.st.done{color:var(--muted);background:var(--bg)}
.st.cancel{color:var(--sale);border-color:var(--sale)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.order.is-cancel{opacity:.7}
.ohead{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap}
.ohead b{font-family:var(--display);font-size:1.05rem}
.oitems{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:.92rem}
.oitems li{display:flex;justify-content:space-between;gap:12px}
.oitems li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.osum{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:.9rem;font-variant-numeric:tabular-nums}
.order .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpis{display:flex;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.kpis b{color:var(--ink);font-variant-numeric:tabular-nums}
.tabs .count{margin-left:6px}
/* Banner */
.banner{position:relative;overflow:hidden;background:var(--banner);color:var(--banner-ink);border-radius:22px;padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,4vw,40px);align-items:center;isolation:isolate}
.banner::before{content:"";position:absolute;z-index:-1;width:min(900px,160%);aspect-ratio:1;left:-12%;top:50%;transform:translateY(-50%);
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--pearl) 9%,transparent) 0deg 7deg,transparent 7deg 22.5deg);
  -webkit-mask:radial-gradient(circle,#000 0 30%,transparent 62%);mask:radial-gradient(circle,#000 0 30%,transparent 62%)}
@media (prefers-reduced-motion:no-preference){.banner::before{animation:giro 90s linear infinite}@keyframes giro{to{transform:translateY(-50%) rotate(360deg)}}}
.banner .logo{width:clamp(108px,18vw,184px);aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:0 0 0 6px color-mix(in srgb,var(--pearl) 14%,transparent),0 18px 40px rgba(0,0,0,.35);display:block}
.banner .txt{display:grid;gap:12px;min-width:0}
.banner .eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:var(--banner-muted)}
.banner h1{font-size:clamp(2rem,5.4vw,3.6rem);font-weight:800;letter-spacing:-.03em;color:var(--banner-ink)}
.banner p{margin:0;color:var(--banner-muted);max-width:44ch;font-size:1.02rem}
.vibes{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0;padding:0;list-style:none}
.vibes li{display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--pearl) 35%,transparent);border-radius:999px;padding:6px 13px 6px 10px;font-weight:600;font-size:.88rem;color:var(--banner-ink)}
.vibes svg{width:16px;height:16px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.banner{grid-template-columns:1fr;justify-items:start}.banner::before{left:-55%;top:22%}}
.hero .lead{color:var(--muted);max-width:60ch;margin:18px 0 0;font-size:1rem}
.logoprev{width:88px;height:88px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
/* Financeiro */
:root{--bar:#33405e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar:#8f9bbb}}
:root[data-theme="dark"]{--bar:#8f9bbb}
.finbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.finnav{display:flex;align-items:center;gap:10px}

function skey(c,s){return (c||'')+'|'+(s||'');}

function stockOf(p,c,s){if(!p.trackStock)return Infinity;return Math.max(0,parseInt(p.stock[skey(c,s)],10)||0);}

  var h='<div class="banner">'+(s.logo?'<img class="logo" src="'+esc(s.logo)+'" alt="Logomarca '+esc(s.name)+'">':'')+'<div class="txt"><span class="eyebrow">Catálogo virtual</span><h1>'+esc(s.name)+'</h1>';
  if(v.length){
    var frase=v.length>1?v.slice(0,-1).join(', ').toLowerCase()+' e '+v[v.length-1].toLowerCase():v[0].toLowerCase();
    h+='<p>Camisas com a nossa vibe: '+esc(frase)+'.</p><ul class="vibes">'+v.map(function(x){return '<li>'+vibeIcon(x)+esc(x)+'</li>';}).join('')+'</ul>';
  }

}

/* ---------- Vitrine ---------- */
function visibleProducts(){
  var q=ui.q.trim().toLowerCase();
  return state.products.filter(function(p){
    if(!p.active)return false;
    if(ui.cat!=='all'&&p.categoryId!==ui.cat)return false;
    if(q&&(p.name+' '+catName(p.categoryId)).toLowerCase().indexOf(q)<0)return false;
    if((ui.fSize||ui.fColor)&&!matchesFilter(p))return false;
    return true;
  });
}
/* filtro por tamanho e cor: mostra só camisas que têm a combinação disponível */
function normCor(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function matchesFilter(p){
  var cores=p.colors.length?p.colors.map(function(c){return c.name;}):[''];
  var tams=p.sizes.length?p.sizes:[''];
  if(ui.fColor)cores=cores.filter(function(c){return normCor(c)===normCor(ui.fColor);});
  if(ui.fSize)tams=tams.filter(function(t){return t===ui.fSize;});
  if(!cores.length||!tams.length)return false;
  return cores.some(function(c){return tams.some(function(t){return stockOf(p,c,t)>0;});});
}
function filterOptions(){
  var order=['PP','P','M','G','GG','XG','XGG','XXG','G1','G2','G3'];
  var sizes={},colors={};
  state.products.forEach(function(p){
    if(!p.active)return;
    var cs=p.colors.length?p.colors:[{name:'',hex:''}], ss=p.sizes.length?p.sizes:[''];
    cs.forEach(function(c){ss.forEach(function(t){if(stockOf(p,c.name,t)>0){if(t)sizes[t]=1;if(c.name){var k=normCor(c.name);if(!colors[k])colors[k]={name:c.name,hex:c.hex};}}});});
  });
  var sz=Object.keys(sizes).sort(function(a,b){var x=order.indexOf(a),y=order.indexOf(b);return (x<0?99:x)-(y<0?99:y)||a.localeCompare(b);});
  var cl=Object.keys(colors).map(function(k){return colors[k];}).sort(function(a,b){return a.name.localeCompare(b.name,'pt');});
  return {sizes:sz,colors:cl};
}
function filterBar(){
  var o=filterOptions();if(!o.sizes.length&&!o.colors.length)return '';
  var h='<div class="ffilters">';
  if(o.sizes.length)h+='<div class="frow" role="group" aria-label="Filtrar por tamanho"><span class="flabel">Tamanho</span>'+o.sizes.map(function(t){return '<button class="fsize" data-a="f-size" data-v="'+esc(t)+'" aria-pressed="'+(ui.fSize===t)+'">'+esc(t)+'</button>';}).join('')+'</div>';
  if(o.colors.length){
    var sel=ui.fColor?o.colors.find(function(c){return normCor(c.name)===normCor(ui.fColor);}):null;
    h+='<div class="frow"><span class="flabel">Cor</span><button class="fpick" data-a="f-colors" aria-expanded="'+(!!ui.fColorOpen)+'">'+(sel?'<i class="dot" style="background:'+esc(sel.hex||'#ccc')+'"></i>'+esc(sel.name):'Todas as cores')+'<span class="chev" aria-hidden="true">'+(ui.fColorOpen?'▲':'▼')+'</span></button>'+(ui.fColor?'<button class="link" data-a="f-color" data-v="'+esc(ui.fColor)+'">tirar cor</button>':'')+'</div>';
  }
  if(o.colors.length&&ui.fColorOpen)h+='<div class="frow fcolors" role="group" aria-label="Escolha a cor">'+o.colors.map(function(c){return '<button class="fcolor" data-a="f-color" data-v="'+esc(c.name)+'" aria-pressed="'+(normCor(ui.fColor)===normCor(c.name))+'" title="'+esc(c.name)+'"><i class="dot" style="background:'+esc(c.hex||'#ccc')+'"></i>'+esc(c.name)+'</button>';}).join('')+'</div>';
  if(ui.fSize||ui.fColor)h+='<div class="frow"><span class="hint">Mostrando camisas disponíveis'+(ui.fColor?' na cor <b>'+esc(ui.fColor)+'</b>':'')+(ui.fSize?' no tamanho <b>'+esc(ui.fSize)+'</b>':'')+'.</span><button class="link" data-a="f-clear">Limpar filtros</button></div>';
  return h+'</div>';
}
function cartCount(){return cart.reduce(function(s,l){return s+l.qty;},0);}
function cartTotal(){return cart.reduce(function(s,l){var p=prodById(l.pid);return s+(p?finalPrice(p)*l.qty:0);},0);}

function chartOf(p){var c=state.categories.find(function(c){return c.id===p.categoryId;});return c&&c.sizeChart?c.sizeChart:'';}
function renderChart(){
  var p=prodById(ui.product);var src=p&&chartOf(p);if(!src)return '';

}

function digits(n){n=String(n||'').replace(/\D/g,'');if(n.length===10||n.length===11)n='55'+n;return n;}
function formatPhone(n){var d=String(n||'').replace(/\D/g,'');if(d.length===13&&d.indexOf('55')===0)d=d.slice(2);if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return n||'';}
function orderCode(){if(!ui.code){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];ui.code=s;}return ui.code;}
function refLine(){
  return cart.map(function(l){var p=prodById(l.pid);if(!p)return '';
    var ci=p.colors.findIndex(function(c){return c.name===l.color;}), si=p.sizes.indexOf(l.size);
    return p.id+'-'+(ci<0?'x':ci)+'-'+(si<0?'x':si)+'-'+l.qty;}).filter(Boolean).join(' ');
}

function moneyIn(re,text){var m=text.match(re);return m?num(m[1]):null;}
function parseOrder(text){
  var line=function(label){var m=text.match(new RegExp('^\\s*\\*?'+label+':\\*?\\s*(.+)$','mi'));return m?m[1].replace(/\*/g,'').trim():'';};
  var code=(text.match(/C[óo]digo do pedido:\s*\*?#?([A-Z0-9]{3,})/i)||[])[1];
  var ref=(text.match(/Ref\.?\s*estoque:\s*([^\n]+)/i)||[])[1];
  if(!ref||!ref.trim())return {error:'Não encontrei a linha “Ref. estoque” nesta mensagem. Cole a mensagem inteira do pedido, do início ao fim.'};
  var prices=[],pm,re=/^\s*(\d+)\s*x\s*R\$\s*([\d.,]+)/gmi;while((pm=re.exec(text)))prices.push(num(pm[2]));
  var items=[],idx=0;
  ref.trim().split(/\s+/).forEach(function(tok){
    var m=tok.replace(/[*_~]/g,'').match(/^([a-z0-9]+)-(x|\d+)-(x|\d+)-(\d+)$/i);if(!m)return;
    var p=prodById(m[1]);
    var it={pid:m[1],qty:parseInt(m[4],10),found:!!p,name:p?p.name:'Produto removido',color:'',size:'',price:prices[idx]!=null&&!isNaN(prices[idx])?prices[idx]:(p?finalPrice(p):0)};
    idx++;
    if(p){it.color=m[2]==='x'?'':(p.colors[+m[2]]||{}).name||'';it.size=m[3]==='x'?'':p.sizes[+m[3]]||'';it.tracked=p.trackStock;
      it.before=stockOf(p,it.color,it.size);it.after=Math.max(0,it.before-it.qty);}
    items.push(it);
  });
  if(!items.length)return {error:'A linha “Ref. estoque” está vazia ou foi alterada. Confira se colou a mensagem original.'};
  var subtotal=moneyIn(/Subtotal:\s*R\$\s*([\d.,]+)/i,text);
  if(subtotal==null||isNaN(subtotal))subtotal=items.reduce(function(t,i){return t+i.price*i.qty;},0);
  var entrega=line('Entrega'), mode=entrega?'entrega':'retirada', pref=line('Refer[êe]ncia');
  if(entrega&&pref)entrega+=' — Ref.: '+pref;
  var shipM=text.match(/Frete[^:\n]*:\s*\*?(R\$\s*[\d.,]+|Gr[áa]tis)/i), ship=0;
  if(shipM&&/R\$/.test(shipM[1]))ship=num(shipM[1])||0;
  var total=moneyIn(/\bTotal:\s*R\$\s*([\d.,]+)/i,text);
  if(total==null||isNaN(total))total=subtotal+ship;
  code=(code||('M'+Date.now().toString(36).slice(-5))).toUpperCase();
  return {code:code,name:line('Nome'),phone:line('WhatsApp'),mode:mode,address:entrega,pay:line('Pagamento'),obs:line('Obs'),items:items,subtotal:subtotal,ship:ship,total:total,
    dup:orders.some(function(o){return o.code===code;})};
}

function pad2(n){return (n<10?'0':'')+n;}
function ymOf(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1);}
function isoDay(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function brDay(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]:'';}
function cxMonth(){var n=new Date();var d=new Date(n.getFullYear(),n.getMonth()+(ui.cxOff||0),1);return {d:d,ym:ymOf(d),a:d.getTime(),b:new Date(d.getFullYear(),d.getMonth()+1,1).getTime(),
  label:MESES[d.getMonth()].replace(/^./,function(x){return x.toUpperCase();})+' de '+d.getFullYear(),days:new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};}
function fixasDoMes(ym){
  var paid=pagas[ym]||{};
  return (fixas.items||[]).filter(function(f){return paid[f.id]||((!f.since||f.since<=ym)&&(!f.until||ym<f.until));})
    .map(function(f){return {f:f,pay:paid[f.id]||null};}).sort(function(a,b){return (a.f.day||0)-(b.f.day||0);});
}
function cxData(){
  var M=cxMonth();
  var vendas=orders.filter(function(o){var t=saleTs(o);return isSale(o)&&t>=M.a&&t<M.b;});
  var vendasTot=vendas.reduce(function(t,o){return t+(o.total||0);},0);
  var fretes=vendas.filter(function(o){return o.mode==='entrega';}).reduce(function(t,o){return t+(o.ship||o.shipCost||(+ship().fee||0));},0);
  var nFretes=vendas.filter(function(o){return o.mode==='entrega';}).length;
  var itens=lanc.filter(function(l){return String(l.date||'').slice(0,7)===M.ym;}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0);});
  var ent=itens.filter(function(l){return l.tipo==='entrada';}), sai=itens.filter(function(l){return l.tipo==='saida';});
  var fx=fixasDoMes(M.ym);
  var fxPagas=fx.filter(function(x){return x.pay;}).reduce(function(t,x){return t+(+x.pay.value||0);},0);
  var fxPend=fx.filter(function(x){return !x.pay;}).reduce(function(t,x){return t+(+x.f.value||0);},0);
  var E=vendasTot+ent.reduce(function(t,l){return t+l.value;},0);
  var S=fretes+fxPagas+sai.reduce(function(t,l){return t+l.value;},0);
  return {M:M,vendas:vendas,vendasTot:vendasTot,fretes:fretes,nFretes:nFretes,ent:ent,sai:sai,fx:fx,fxPagas:fxPagas,fxPend:fxPend,E:E,S:S,saldo:E-S};
}

function catalogProducts(cat){
  return state.products.filter(function(p){return p.active!==false&&(cat==='all'||p.categoryId===cat);}).map(function(p){
    var cores=[];
    colorNames(p).forEach(function(cn){
      var sizes=[];
      sizeNames(p).forEach(function(sn){var v=stockOf(p,cn,sn);if(v>0)sizes.push({s:sn,q:p.trackStock?v:null});});
      if(sizes.length)cores.push({name:cn,hex:((p.colors||[]).find(function(c){return c.name===cn;})||{}).hex,sizes:sizes});
    });
    return {p:p,cores:cores,sizes:cores.length};
  }).filter(function(x){return x.cores.length>0;});
}

function loadScript(src){return new Promise(function(ok,bad){var e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=function(){bad(new Error('não carregou '+src));};document.head.appendChild(e);});}
function toDataUrl(url){

}

function downloadCatalog(btn){

    window.jspdf?0:loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')

function stockReportRows(cat){
  var rows=[];
  state.products.filter(function(p){return p.trackStock&&(cat==='all'||p.categoryId===cat);}).sort(function(a,b){return a.name.localeCompare(b.name,'pt');}).forEach(function(p){
    var sell=finalPrice(p), c=costOf(p.id);

      sizeNames(p).slice().sort(function(a,b){var x=order.indexOf(a),y=order.indexOf(b);return (x<0?99:x)-(y<0?99:y);}).forEach(function(sn){
        var q=stockOf(p,cn,sn);if(q>0)rows.push({p:p,prod:p.name,cat:catName(p.categoryId),cor:cn||'—',tam:sn||'—',q:q,preco:sell,total:q*sell,custo:c});

  var cur=null,sq=0,sv=0;

function stockCsv(cat){
  var rows=stockReportRows(cat), sep=';';
  var f=function(n){return String(Math.round(n*100)/100).replace('.',',');};
  var q=function(x){return '"'+String(x).replace(/"/g,'""')+'"';};
  var lines=['Produto;Categoria;Cor;Tamanho;Quantidade;Preço de venda;Total de venda;Custo unitário;Total de custo'];
  var Tq=0,Tv=0,Tc=0;
  rows.forEach(function(r){Tq+=r.q;Tv+=r.total;Tc+=r.custo!=null?r.q*r.custo:0;lines.push([q(r.prod),q(r.cat),q(r.cor),q(r.tam),r.q,f(r.preco),f(r.total),r.custo!=null?f(r.custo):'',r.custo!=null?f(r.q*r.custo):''].join(sep));});
  lines.push(['"TOTAL"','','','',Tq,'',f(Tv),'',f(Tc)].join(sep));
  var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='estoque-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function renderStock(){
  var cat=ui.scat||'all';
  if(ui.stockView==='relatorio'){
    return '<div class="filters noprint" style="padding-block:0"><div class="seg" role="tablist"><button role="tab" data-a="st-view" data-v="resumo" aria-selected="false">Resumo</button><button role="tab" data-a="st-view" data-v="relatorio" aria-selected="true">Relatório completo</button></div>'+
      '<button class="chip" data-a="s-cat" data-v="all" aria-pressed="'+(cat==='all')+'">Todas</button>'+state.categories.map(function(c){return '<button class="chip" data-a="s-cat" data-v="'+c.id+'" aria-pressed="'+(cat===c.id)+'">'+esc(c.name)+'</button>';}).join('')+'</div>'+renderStockReport(cat);
  }
  var prods=state.products.filter(function(p){return cat==='all'||p.categoryId===cat;});
  var tracked=prods.filter(function(p){return p.trackStock;}), free=prods.filter(function(p){return !p.trackStock;});
  var T={q:0,cost:0,sale:0,noCost:0,noCostQ:0,out:0,low:0};
  var rows=tracked.map(function(p){
    var q=totalStock(p), c=costOf(p.id), sell=finalPrice(p);
    T.q+=q;T.sale+=q*sell;
    if(c==null){T.noCost++;T.noCostQ+=q;}else T.cost+=q*c;
    var opts=[],zero=0,few=0;
    colorNames(p).forEach(function(cn){sizeNames(p).forEach(function(sn){var n=stockOf(p,cn,sn);if(n===0)zero++;else if(n<=2)few++;opts.push({c:cn,s:sn,n:n});});});
    if(q===0)T.out++;else if(zero||few)T.low++;
    return {p:p,q:q,c:c,sell:sell,opts:opts,zero:zero,few:few};
  }).sort(function(a,b){return b.q*b.sell-a.q*a.sell;});
  var reserved=orders.filter(function(o){return o.status==='novo'||o.status==='confirmado';}).reduce(function(t,o){return t+(o.reserved||[]).reduce(function(s,r){return s+r.qty;},0);},0);
  var h='<div class="filters" style="padding-block:0"><div class="seg" role="tablist"><button role="tab" data-a="st-view" data-v="resumo" aria-selected="true">Resumo</button><button role="tab" data-a="st-view" data-v="relatorio" aria-selected="false">Relatório completo</button></div><button class="chip" data-a="s-cat" data-v="all" aria-pressed="'+(cat==='all')+'">Todas</button>'+state.categories.map(function(c){return '<button class="chip" data-a="s-cat" data-v="'+c.id+'" aria-pressed="'+(cat===c.id)+'">'+esc(c.name)+'</button>';}).join('')+'</div>';
  h+='<div class="tiles">'+
    '<div class="tile"><span>Peças em estoque</span><b>'+T.q.toLocaleString('pt-BR')+'</b><small>'+tracked.length+' '+(tracked.length===1?'produto':'produtos')+(reserved?' · +'+reserved+' reservadas em pedidos':'')+'</small></div>'+
    '<div class="tile"><span>Valor de custo</span><b>'+money(T.cost)+'</b><small>'+(T.noCost?'<span class="low">'+T.noCostQ+' peças sem custo cadastrado</span>':'Quanto você investiu nessas peças')+'</small></div>'+
    '<div class="tile"><span>Valor de venda</span><b>'+money(T.sale)+'</b><small>Se vender tudo pelo preço atual</small></div>'+
    '<div class="tile"><span>Lucro potencial</span><b class="'+(T.sale-T.cost<0?'neg':'pos')+'">'+(T.noCost&&!T.cost?'—':money(T.sale-T.cost))+'</b><small>'+(T.sale&&!T.noCost?'Margem '+pct((T.sale-T.cost)/T.sale):T.noCost?'Falta custo em '+T.noCost+' '+(T.noCost===1?'produto':'produtos'):'—')+'</small></div></div>';
  if(T.out||T.low)h+='<div class="kpis"><span>'+(T.out?'<b class="neg">'+T.out+'</b> '+(T.out===1?'produto esgotado':'produtos esgotados'):'')+(T.out&&T.low?' · ':'')+(T.low?'<b>'+T.low+'</b> com cor ou tamanho acabando':'')+'</span></div>';
  h+='<div class="rows">';
  if(!rows.length)h+='<div class="empty">Nenhum produto com controle de estoque'+(cat!=='all'?' nesta categoria':'')+'. Ative em Produtos → Editar → “Controlar estoque”.</div>';
  rows.forEach(function(r){
    var open=ui.openStock===r.p.id;
    h+='<div class="order"><div class="srow">'+picHTML(r.p)+'<div class="meta"><b>'+esc(r.p.name)+'</b><small>'+esc(catName(r.p.categoryId))+' · venda '+money(r.sell)+(r.c!=null?' · custo '+money(r.c):' · <span class="low">sem custo</span>')+'</small></div></div>';
    h+='<div class="osum"><span><b>'+r.q+'</b> '+(r.q===1?'peça':'peças')+'</span><span>Custo '+(r.c!=null?money(r.q*r.c):'—')+'</span><span>Venda '+money(r.q*r.sell)+'</span>'+(r.q===0?'<span class="low">Esgotado</span>':r.zero?'<span class="low">'+r.zero+' '+(r.zero===1?'opção zerada':'opções zeradas')+'</span>':'')+'</div>';
    h+='<div class="acts"><button class="btn sm" data-a="st-toggle" data-id="'+r.p.id+'">'+(open?'Ocultar grade':'Ver por cor e tamanho')+'</button><button class="btn sm ghost" data-a="edit-product" data-id="'+r.p.id+'">Ajustar estoque</button></div>';
    if(open){
      var ss=sizeNames(r.p);
      h+='<div class="scroll"><table class="stk sv"><thead><tr><th></th>'+ss.map(function(s){return '<th>'+(s?esc(s):'Qtd')+'</th>';}).join('')+'<th>Total</th></tr></thead><tbody>'+
        colorNames(r.p).map(function(cn){var tot=0;return '<tr><td>'+(cn?esc(cn):'Único')+'</td>'+ss.map(function(sn){var n=stockOf(r.p,cn,sn);tot+=n;return '<td class="'+(n===0?'z':n<=2?'f':'')+'">'+n+'</td>';}).join('')+'<td><b>'+tot+'</b></td></tr>';}).join('')+
        '</tbody></table></div>';
    }
    h+='</div>';
  });
  h+='</div>';
  if(free.length)h+='<p class="hint">Sem controle de estoque (não entram na conta): '+free.map(function(p){return esc(p.name);}).join(', ')+'.</p>';
  h+='<p class="hint">O valor de venda usa o preço atual de cada produto, com promoção quando houver. Peças reservadas em pedidos aguardando pagamento já saíram desta conta.</p>';
  return h;
}

/* ---------- Avisos (painel) ---------- */
function alertAvail(a){var p=prodById(a.pid);if(!p)return null;return stockOf(p,a.color,a.size);}
function readyAlerts(){return alerts.filter(function(a){var n=alertAvail(a);return a.status==='pendente'&&n!=null&&n>0;});}
function parseAlert(text){
  var line=function(label){var m=text.match(new RegExp('^\\s*\\*?'+label+':\\*?\\s*(.+)$','mi'));return m?m[1].replace(/\*/g,'').trim():'';};
  var ref=(text.match(/Ref\.?\s*aviso:\s*([a-z0-9]+)-(x|\d+)-(x|\d+)/i));
  if(!ref)return {error:'Não encontrei a linha “Ref. aviso”. Cole a mensagem inteira que o cliente mandou pedindo o aviso.'};
  var p=prodById(ref[1]);
  if(!p)return {error:'Esse produto não existe mais na loja.'};
  var code=((text.match(/C[óo]digo do aviso:\s*\*?#?([A-Z0-9]{3,})/i)||[])[1]||('A'+Date.now().toString(36).slice(-5))).toUpperCase();
  return {code:code,pid:p.id,name:p.name,color:ref[2]==='x'?'':(p.colors[+ref[2]]||{}).name||'',size:ref[3]==='x'?'':p.sizes[+ref[3]]||'',
    cname:line('Nome'),phone:line('WhatsApp'),dup:alerts.some(function(a){return a.code===code;})};
}
function alertMsg(a){
  var first=String(a.cname||'').split(/\s+/)[0]||'';
  return 'Oi'+(first?', '+first:'')+'! Aqui é da '+state.settings.name+'. A peça que você pediu para avisar voltou ao estoque: *'+a.name+'*'+(a.color?' '+a.color:'')+(a.size?', tamanho '+a.size:'')+'. Quer garantir a sua? É só responder aqui.';
}

  h+='<div class="filters" style="padding-block:0">'+[['pronto','Voltou ao estoque',ready.length],['pendente','Aguardando reposição',pend.length],['avisado','Já avisados',done.length]].map(function(x){return '<button class="chip" data-a="a-filter" data-v="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+' · '+x[2]+'</button>';}).join('')+'</div>';

  }

    h+='<div>'+esc(a.cname||'Cliente')+(a.phone?' · '+esc(a.phone):'')+' <span class="hint">· pediu em '+esc(a.at)+'</span></div><div class="acts">';
    if(a.status==='pendente'&&wl)h+='<a class="btn sm '+(n>0?'wa':'')+'" href="'+esc(wl+'?text='+encodeURIComponent(alertMsg(a)))+'" target="_blank" rel="noopener" data-a="alert-sent" data-id="'+esc(a.code)+'">'+(n>0?'Avisar no WhatsApp':'Avisar mesmo assim')+'</a>';
    if(ui.confirmDel==='al-'+a.code)h+='<span class="confirm">Apagar? <button class="btn sm danger" data-a="del-alert" data-id="'+esc(a.code)+'">Sim</button><button class="btn sm" data-a="cancel-del">Não</button></span>';
    else h+='<button class="btn sm ghost" data-a="ask-del" data-id="al-'+esc(a.code)+'">Apagar</button>';
    h+='</div></div>';
  });

function saveAlert(){
  var P=ui.aparsed;if(!P||P.error||P.dup||!db)return;
  var a={code:P.code,pid:P.pid,name:P.name,color:P.color,size:P.size,cname:P.cname,phone:P.phone,ts:Date.now(),at:stamp(),status:'pendente'};
  db.doc('avisos/'+a.code).set(a).then(function(){ui.aparsed=null;ui.alertText='';ui.afilter='pendente';ui.msg='Aviso salvo. Quando a peça voltar ao estoque, ela aparece em “Voltou ao estoque”.';render();})
    .catch(function(e){ui.msg='Não deu para salvar o aviso'+(e&&e.code?' ('+e.code+')':'')+'.';render();});

function makeDb(sb){
  var cache={}, loaded={}, loading={}, subs=[];
  function colOf(p){return p.split('/').slice(0,-1).join('/');}
  function idOf(p){return p.split('/').pop();}
  function mk(p){var d=cache[p];return {id:idOf(p),exists:d!==undefined,data:function(){return d;},metadata:{fromCache:false,hasPendingWrites:false}};}
  function colSnap(s){
    var arr=Object.keys(cache).filter(function(p){return colOf(p)===s.col;}).map(mk);
    if(s.ord)arr.sort(function(a,b){var x=a.data()[s.ord],y=b.data()[s.ord];if(x===y)return 0;if(x===undefined)return 1;if(y===undefined)return -1;return (x<y?-1:1)*(s.dir==='desc'?-1:1);});
    if(s.lim)arr=arr.slice(0,s.lim);
    return {docs:arr,size:arr.length,empty:!arr.length,docChanges:function(){return [];}};
  }
  function fire(col){subs.forEach(function(s){try{if(s.doc){if(colOf(s.doc)===col)s.next(mk(s.doc));}else if(s.col===col)s.next(colSnap(s));}catch(e){console.error(e);}});}
  function load(col){
    if(loaded[col])return Promise.resolve();
    if(!loading[col])loading[col]=sb.from('docs').select('path,dados').eq('colecao',col).then(function(r){if(r.error){loading[col]=null;throw r.error;}(r.data||[]).forEach(function(x){cache[x.path]=x.dados;});loaded[col]=true;});
    return loading[col];
  }
  sb.channel('docs-painel').on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(pl){
    if(pl.eventType==='DELETE'){var p=pl.old&&pl.old.path;if(p&&cache[p]!==undefined){delete cache[p];fire(colOf(p));}}
    else if(pl.new&&pl.new.path){cache[pl.new.path]=pl.new.dados;fire(pl.new.colecao);}
  }).on('postgres_changes',{event:'*',schema:'public',table:'produtos'},function(){clearTimeout(makeDb.t);makeDb.t=setTimeout(reloadProducts,800);}).subscribe();
  function write(p,data){cache[p]=data;fire(colOf(p));return sb.from('docs').upsert({path:p,colecao:colOf(p),dados:data,atualizado:new Date().toISOString()}).then(function(r){if(r.error)throw r.error;});}
  function docRef(p){return {
    id:idOf(p),
    get:function(){return load(colOf(p)).then(function(){return mk(p);});},
    set:function(d){return write(p,JSON.parse(JSON.stringify(d)));},
    update:function(d){return load(colOf(p)).then(function(){return write(p,Object.assign({},cache[p]||{},JSON.parse(JSON.stringify(d))));});},
    delete:function(){var c=colOf(p);delete cache[p];fire(c);return sb.from('docs').delete().eq('path',p).then(function(r){if(r.error)throw r.error;});},
    onSnapshot:function(next,err){var s={doc:p,next:next};subs.push(s);load(colOf(p)).then(function(){next(mk(p));},function(e){if(err)err(e);});return function(){subs=subs.filter(function(x){return x!==s;});};}
  };}
  function query(col,ord,dir,lim){return {
    orderBy:function(f,d){return query(col,f,d||'asc',lim);},
    limit:function(n){return query(col,ord,dir,n);},
    where:function(){return this;},
    get:function(){return load(col).then(function(){return colSnap({col:col,ord:ord,dir:dir,lim:lim});});},
    onSnapshot:function(next,err){var s={col:col,ord:ord,dir:dir,lim:lim,next:next};subs.push(s);load(col).then(function(){next(colSnap(s));},function(e){if(err)err(e);});return function(){subs=subs.filter(function(x){return x!==s;});};},
    doc:function(id){return docRef(col+'/'+(id||Math.random().toString(36).slice(2,12)));},
    add:function(d){var r=docRef(col+'/'+Math.random().toString(36).slice(2,12));return r.set(d).then(function(){return r;});}
  };}
  function refresh(col){
    return sb.from('docs').select('path,dados').eq('colecao',col).then(function(r){
      if(r.error)return;
      var seen={};(r.data||[]).forEach(function(x){seen[x.path]=1;cache[x.path]=x.dados;});
      Object.keys(cache).forEach(function(p){if(colOf(p)===col&&!seen[p])delete cache[p];});
      loaded[col]=true;fire(col);
    });
  }
  return {doc:docRef,collection:function(c){return query(c);},refresh:refresh};
}

function dataUrlToBlob(u){var m=u.match(/^data:([^;]+);base64,(.*)$/);var bin=atob(m[2]),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:m[1]});}
function uploadIfData(u,folder){
  if(typeof u!=='string'||u.indexOf('data:')!==0)return Promise.resolve(u);
  var blob=dataUrlToBlob(u), ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg').replace('svg+xml','svg');
  var path=folder+'/'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  return sbc.storage.from('fotos').upload(path,blob,{contentType:blob.type,upsert:false,cacheControl:'31536000'}).then(function(r){
    if(r.error)throw r.error;
    return sbc.storage.from('fotos').getPublicUrl(path).data.publicUrl;
  });
}
function uploadAll(st){
  var jobs=[];
  st.products.forEach(function(p){(p.images||[]).forEach(function(src,i){jobs.push(uploadIfData(src,'produtos/'+p.id).then(function(u){p.images[i]=u;}));});});
  if(st.settings.logo)jobs.push(uploadIfData(st.settings.logo,'loja').then(function(u){st.settings.logo=u;}));
  st.categories.forEach(function(c){if(c.sizeChart)jobs.push(uploadIfData(c.sizeChart,'medidas').then(function(u){c.sizeChart=u;}));});
  return Promise.all(jobs);
}

function publish(okMsg){
  if(!canEdit||!sbc){ui.msg='Entre com o login da equipe para salvar.';render();return Promise.resolve();}
  if(ui.publishing){ui.publishAgain=okMsg||true;return Promise.resolve();}
  ui.publishing=true;ui.msg='';render();
  var okText=okMsg||'Salvo. Os clientes já veem a versão nova.';
  var J=function(x){return JSON.stringify(x===undefined?null:x);};
  // junta 3 versões: o que eu carreguei (base), o que eu mudei (mine) e o que está no servidor agora (srv)
  function merge3(base,mine,srv){
    var out={},keys={};[base,mine,srv].forEach(function(o){Object.keys(o||{}).forEach(function(k){keys[k]=1;});});
    Object.keys(keys).forEach(function(k){
      if(k==='images'){out[k]=mergeList(base&&base[k],mine&&mine[k],srv&&srv[k]);return;}
      var mineChanged=J(mine&&mine[k])!==J(base&&base[k]);
      var v=mineChanged?(mine||{})[k]:(srv||{})[k];
      if(v!==undefined)out[k]=v;
    });
    return out;
  }
  // fotos: nunca some uma foto que outra pessoa/aba adicionou; só sai a que EU tirei
  function mergeList(base,mine,srv){
    base=base||[];mine=mine||[];srv=srv||[];
    var removidas=base.filter(function(u){return mine.indexOf(u)<0;});
    var res=mine.slice();
    srv.forEach(function(u){if(res.indexOf(u)<0&&removidas.indexOf(u)<0)res.push(u);});
    return res;
  }
  function strip(p){var d=clone(p);delete d.stock;delete d.id;return d;}
  return uploadAll(state).then(function(){
    return Promise.all([sbc.from('produtos').select('id,dados,estoque,ordem'),sbc.from('config').select('dados').eq('id',1)]);
  }).then(function(rs){
    if(rs[0].error)throw rs[0].error;if(rs[1].error)throw rs[1].error;
    var srvById={};(rs[0].data||[]).forEach(function(r){srvById[r.id]=r;});
    var baseById={};SAVED.products.forEach(function(p){baseById[p.id]=p;});
    var rowsStock=[],rowsNoStock=[],ops=[];
    state.products.forEach(function(p,i){
      var base=baseById[p.id], srv=srvById[p.id];
      if(!base){ // produto novo
        rowsStock.push({id:p.id,dados:strip(p),estoque:p.stock||{},ordem:i,atualizado:new Date().toISOString()});return;
      }
      var dadosMudou=J(strip(p))!==J(strip(base)), estoqueMudou=J(p.stock||{})!==J(base.stock||{}), ordemMudou=SAVED.products.indexOf(base)!==i;
      if(!dadosMudou&&!estoqueMudou&&!ordemMudou)return; // não mexi: não regravo nada
      if(!srv){ // alguém apagou no servidor enquanto eu editava: recria com o que eu tenho
        rowsStock.push({id:p.id,dados:strip(p),estoque:p.stock||{},ordem:i,atualizado:new Date().toISOString()});return;
      }
      var row={id:p.id,dados:dadosMudou?merge3(strip(base),strip(p),srv.dados||{}):srv.dados,ordem:i,atualizado:new Date().toISOString()};
      if(estoqueMudou){
        var est=Object.assign({},srv.estoque||{});
        var ks={};Object.keys(p.stock||{}).concat(Object.keys(base.stock||{})).forEach(function(k){ks[k]=1;});
        Object.keys(ks).forEach(function(k){if(J((p.stock||{})[k])!==J((base.stock||{})[k])){if((p.stock||{})[k]===undefined)delete est[k];else est[k]=p.stock[k];}});
        row.estoque=est;rowsStock.push(row);
      } else rowsNoStock.push(row);
    });
    var gone=SAVED.products.filter(function(p){return !state.products.some(function(x){return x.id===p.id;});}).map(function(p){return p.id;});
    var baseConf={settings:SAVED.settings,categories:SAVED.categories}, mineConf={settings:state.settings,categories:state.categories};
    if(J(baseConf)!==J(mineConf)){
      var srvConf=(rs[1].data&&rs[1].data[0]&&rs[1].data[0].dados)||{};
      var conf={settings:merge3(SAVED.settings,state.settings,srvConf.settings||{}),categories:J(state.categories)!==J(SAVED.categories)?state.categories:(srvConf.categories||state.categories)};
      ops.push(sbc.from('config').upsert({id:1,dados:conf,atualizado:new Date().toISOString()}));
    }
    if(rowsStock.length)ops.push(sbc.from('produtos').upsert(rowsStock));
    if(rowsNoStock.length)ops.push(sbc.from('produtos').upsert(rowsNoStock));
    if(gone.length)ops.push(sbc.from('produtos').delete().in('id',gone));
    return Promise.all(ops);
  }).then(function(rs){
    var err=(rs||[]).find(function(r){return r&&r.error;});if(err)throw err.error;
    return fetchStore();
  }).then(function(fresh){
    var editing=ui.editing;
    SAVED=fresh;state=clone(fresh);ui.editing=editing;
    ui.publishing=false;ui.msg=okText;render();
    if(ui.publishAgain){var m=ui.publishAgain;ui.publishAgain=null;if(dirty())publish(m===true?undefined:m);}
  }).catch(function(e){
    console.error(e);ui.publishing=false;ui.publishAgain=null;
    ui.msg='Não deu para salvar agora'+(e&&e.message?' ('+e.message+')':'')+'. Suas alterações continuam aqui: confira a internet e toque em “Publicar alterações”.';render();
  });
}

function doLogin(){
  var em=((document.getElementById('lg-email')||{}).value||'').trim(), pw=(document.getElementById('lg-pass')||{}).value||'', m=ui.loginMode||'entrar';
  ui.lgEmail=em;ui.err={};ui.loginInfo='';
  if(!/^\S+@\S+\.\S+$/.test(em)){ui.err.login='Digite um e-mail válido.';render();return;}
  if(m!=='esqueci'&&pw.length<(m==='criar'?8:1)){ui.err.login=m==='criar'?'A senha precisa ter pelo menos 8 caracteres.':'Digite a senha.';render();return;}
  ui.loginBusy=true;render();
  var back=location.origin+'/#painel', p;
  if(m==='criar')p=sbc.auth.signUp({email:em,password:pw,options:{emailRedirectTo:back}});
  else if(m==='esqueci')p=sbc.auth.resetPasswordForEmail(em,{redirectTo:back});
  else p=sbc.auth.signInWithPassword({email:em,password:pw});
  p.then(function(r){
    ui.loginBusy=false;
    if(r.error){ui.err.login=/Invalid login/i.test(r.error.message)?'E-mail ou senha incorretos.':/not confirmed/i.test(r.error.message)?'Confirme seu e-mail pelo link que enviamos antes de entrar.':r.error.message;render();return;}
    if(m==='criar'&&!(r.data&&r.data.session)){ui.loginInfo='Enviamos um link de confirmação para '+em+'. Abra o e-mail, confirme e depois entre aqui.';ui.loginMode='entrar';render();return;}
    if(m==='esqueci'){ui.loginInfo='Se este e-mail tiver acesso, enviamos um link para criar uma nova senha.';render();return;}
    afterAuth(r.data.session);
  });
}
function afterAuth(session){
  if(!session){canEdit=false;ui.authUser='';render();return;}
  ui.authUser=session.user&&session.user.email||'';
  sbc.rpc('is_admin').then(function(r){
    canEdit=!r.error&&r.data===true;
    if(canEdit){
      if(ui.view==='login'){ui.view='painel';ui.tab='pedidos';}
      if(!db)startPanelData();
    }
    render();
  });
}
function startPanelData(){
  try{sbc.auth.getSession().then(function(r){var t=r&&r.data&&r.data.session&&r.data.session.access_token;if(t&&sbc.realtime&&sbc.realtime.setAuth)sbc.realtime.setAuth(t);});}catch(e){}
  var d=makeDb(sbc);db=d;
  function atualizar(){if(!canEdit)return;['pedidos','avisos'].forEach(function(c){d.refresh(c);});if(!ui.editing&&!ui.publishing&&!dirty())reloadProducts();}
  setInterval(function(){if(!document.hidden)atualizar();},30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)atualizar();});
  d.collection('pedidos').orderBy('ts','desc').limit(1000).onSnapshot(function(snap){
    orders=snap.docs.map(function(x){return normStatus(Object.assign({},x.data()));});ordersState='ok';
    if(ui.view==='painel'&&!ui.editing)render();
  },function(){ordersState='error';if(ui.view==='painel'&&!ui.editing)render();});
  d.doc('privado/custos').onSnapshot(function(sn){costs=sn.exists?Object.assign({},sn.data()):{};if(ui.view==='painel'&&!ui.editing)render();},function(){});
  d.collection('avisos').orderBy('ts','desc').limit(1000).onSnapshot(function(sn){alerts=sn.docs.map(function(x){return x.data();});if(ui.view==='painel'&&!ui.editing)render();},function(){});
  d.doc('privado/fixas').onSnapshot(function(sn){fixas=sn.exists?Object.assign({items:[]},sn.data()):{items:[]};if(ui.view==='painel'&&!ui.editing&&ui.tab==='financeiro')render();},function(){});
  d.doc('privado/fixaspagas').onSnapshot(function(sn){pagas=sn.exists?Object.assign({},sn.data()):{};if(ui.view==='painel'&&!ui.editing&&ui.tab==='financeiro')render();},function(){});
  d.collection('privado/caixa/itens').orderBy('ts','desc').limit(1000).onSnapshot(function(sn){lanc=sn.docs.map(function(x){return x.data();});if(ui.view==='painel'&&!ui.editing&&ui.tab==='financeiro')render();},function(){});
  d.doc('privado/metas').onSnapshot(function(sn){goals=Object.assign({dia:0,mes:0,ano:0},sn.exists?sn.data():{});if(ui.view==='painel'&&!ui.editing&&ui.tab==='financeiro')render();},function(){});
  loadTeam();
}

}
function normName(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^camisa\s+/,'').replace(/\s+/g,' ').trim();}
function mergeImport(j){
  // adiciona produtos novos e atualiza os que já existem (mesmo nome), mantendo fotos e descrição
  var novos=0,atual=0,custoNovo={};
  (j.categories||[]).forEach(function(c){
    if(!state.categories.some(function(x){return normName(x.name)===normName(c.name);}))state.categories.push({id:uid('c'),name:c.name});
  });
  function catId(nome){var c=state.categories.find(function(x){return normName(x.name)===normName(nome);});return c?c.id:null;}
  j.products.forEach(function(np){
    var ex=state.products.find(function(p){return normName(p.name)===normName(np.name);});
    var dados={categoryId:catId(np.category),price:np.price,salePrice:np.salePrice||null,colors:np.colors||[],sizes:np.sizes||[],trackStock:true,stock:np.stock||{},active:true};
    if(ex){Object.assign(ex,dados);if(np.desc&&!ex.desc)ex.desc=np.desc;atual++;}
    else{ex=Object.assign({id:uid('p'),name:np.name,desc:np.desc||'',images:[]},dados);state.products.push(ex);novos++;}
    if(typeof np.cost==='number')custoNovo[ex.id]=np.cost;
  });
  state=normalize(state);
  if(db&&Object.keys(custoNovo).length)db.doc('privado/custos').set(Object.assign({},costs,custoNovo)).catch(function(){});
  ui.msg='Planilha lida: '+novos+' produtos novos e '+atual+' atualizados. Confira e toque em “Publicar alterações” para colocar na loja.';
  ui.tab='produtos';render();
}
function importFile(f){
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(j&&j.modo==='mesclar'&&Array.isArray(j.products)){mergeImport(j);return;}
      if(!j||!j.settings||!Array.isArray(j.products))throw new Error('formato');
      state=normalize({settings:j.settings,categories:j.categories||[],products:j.products});
      var jobs=[];
      if(db&&j.custos&&Object.keys(j.custos).length)jobs.push(db.doc('privado/custos').set(Object.assign({},costs,j.custos)));
      if(db&&j.metas)jobs.push(db.doc('privado/metas').set(j.metas));
      if(db&&j.fixas&&j.fixas.items&&j.fixas.items.length)jobs.push(db.doc('privado/fixas').set(j.fixas));
      Promise.all(jobs).catch(function(){});
      ui.msg='Importado: '+state.products.length+' produtos. Confira e toque em “Publicar alterações” para salvar no site.';
      ui.tab='produtos';render();
    }catch(e){ui.msg='Este arquivo não é uma importação válida da loja.';render();}
  };
  r.readAsText(f);
}

/* ---------- Pagamento e retorno ---------- */
function payState(){try{return JSON.parse(localStorage.getItem('camisaria-pay')||'null');}catch(e){return null;}}
function setPayState(v){try{if(v)localStorage.setItem('camisaria-pay',JSON.stringify(v));else localStorage.removeItem('camisaria-pay');}catch(e){}}
function checkoutPayload(){return {cart:cart.map(function(l){return {pid:l.pid,color:l.color||'',size:l.size||'',qty:l.qty};}),buyer:buyer,metodo:buyer.metodo||'whatsapp'};}
function doCheckout(){
  var met=PAY_ONLINE?(buyer.metodo||'pix'):'whatsapp';buyer.metodo=met;saveBuyer();
  var win=null;
  if(met==='whatsapp'){try{win=window.open('about:blank','_blank');}catch(e){win=null;}}
  ui.paying=true;ui.err={};render();
  api('criar-pedido',checkoutPayload()).then(function(r){
    ui.code=r.code;
    if(met==='whatsapp'){
      ui.sentText=orderText();ui.sentLink=waLink();
      if(win)win.location.href=ui.sentLink;else location.href=ui.sentLink;
      cart=[];saveCart();ui.code=r.code;ui.sent=true;ui.paying=false;reloadStoreQuiet();render();
    }else{
      setPayState({code:r.code,payUrl:r.payUrl,ts:Date.now()});
      location.href=r.payUrl;
    }
  }).catch(function(e){
    if(win)try{win.close();}catch(x){}
    ui.paying=false;ui.err.checkout=(e.message||'Não deu para finalizar agora. Tente de novo.')+(e.data&&e.data.detalhe?' ['+e.data.detalhe+']':'');
    if(e.data&&e.data.estoque)reloadStoreQuiet();
    render();
  });
}
function reloadStoreQuiet(){if(sbc)fetchStore().then(function(f){applyFresh(f);render();}).catch(function(){});}
var poll=null;
function renderReturn(){
  var R=ui.ret;if(!R)return '';
  var st=R.status, h='<div class="shade chartshade" data-a="close-ret"><div class="sheet chartsheet retbox" role="dialog" aria-modal="true" aria-label="Seu pedido" data-stop="1"><div class="sheet-head"><h3>Pedido #'+esc(R.code)+'</h3><button class="x" data-a="close-ret" aria-label="Fechar">×</button></div><div class="retbody">';
  if(st==='pago'||st==='enviado')h+='<div class="retico ok">✓</div><h2>Pagamento confirmado!</h2><p>Obrigado'+(R.nome?', '+esc(R.nome):'')+'. Já estamos separando seu pedido e vamos te chamar no WhatsApp.</p>';
  else if(st==='cancelado')h+='<div class="retico bad">!</div><h2>Pedido cancelado</h2><p>O pagamento não foi concluído a tempo e as peças voltaram para a loja. Você pode montar o pedido de novo.</p>';
  else if(R.analise)h+='<div class="retico">…</div><h2>Pagamento em análise</h2><p>O PagBank está analisando o pagamento do cartão. Assim que aprovar, a gente te avisa.</p>';
  else if(st==='erro')h+='<div class="retico bad">!</div><h2>Não encontramos este pedido</h2><p>Se você pagou, fale com a gente no WhatsApp com o número do pedido.</p>';
  else{
    var ps=payState();
    h+='<div class="retico spin" aria-hidden="true"></div><h2>Aguardando o pagamento…</h2><p>Assim que o pagamento cair, esta tela atualiza sozinha. No Pix costuma levar poucos segundos.</p>';
    if(ps&&ps.code===R.code&&ps.payUrl)h+='<a class="btn dark" href="'+esc(ps.payUrl)+'">Voltar para o pagamento</a>';
  }
  var wa=digits(state.settings.whatsapp);
  if(wa)h+='<a class="btn" href="https://wa.me/'+wa+'?text='+encodeURIComponent('Olá! Sobre o meu pedido #'+R.code+'.')+'" target="_blank" rel="noopener">Falar no WhatsApp</a>';
  return h+'</div></div></div>';
}
function startReturn(code){
  ui.ret={code:code,status:'carregando'};var n=0;
  function tick(){
    api('status-pedido?c='+encodeURIComponent(code)).then(function(r){
      ui.ret={code:code,status:r.status,analise:r.analise,nome:r.nome};
      if(r.status==='pago'||r.status==='enviado'){var ps=payState();if(ps&&ps.code===code){cart=[];saveCart();setPayState(null);}}
      render();
      if((r.status==='confirmado'||r.status==='novo')&&++n<90)poll=setTimeout(tick,4000);
    }).catch(function(){ui.ret={code:code,status:'erro'};render();});
  }
  tick();
}

var app=document.getElementById('app');
function render(){
  var f=document.activeElement&&document.activeElement.id, pos=null;
  try{if(f&&document.activeElement.selectionStart!=null)pos=document.activeElement.selectionStart;}catch(e){}
  var sh=app.querySelector('.sheet'), shKind=sh?(sh.closest('.side')?'cart':'prod'):null, shTop=sh?sh.scrollTop:0;
  app.innerHTML=ui.view==='senha'?renderNewPass():ui.view==='painel'&&canEdit?renderAdmin():ui.view==='login'||(ui.view==='painel'&&!canEdit)?renderLogin():renderStore();
  var sh2=app.querySelector('.sheet');if(sh2&&shKind===(sh2.closest('.side')?'cart':'prod'))sh2.scrollTop=shTop;
  ui.anim=false;
  document.title=state.settings.name;
  document.documentElement.classList.toggle('lock',!!(ui.view==='loja'&&(ui.product||ui.cartOpen||ui.ret)));
  if(f){var el=document.getElementById(f);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
}
var toastT;
function toast(t){var old=document.querySelector('.toast');if(old)old.remove();var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(function(){d.remove();},2600);}
function clampQty(){var p=prodById(ui.product);if(!p)return;var ready=(!p.colors.length||ui.color)&&(!p.sizes.length||ui.size);var max=ready?avail(p,ui.color,ui.size):Infinity;ui.qty=Math.max(1,Math.min(ui.qty,max));}

app.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-a]');if(!t)return;
  if(t.classList.contains('shade')&&ev.target.closest('[data-stop]'))return;
  if(t.disabled)return;
  var a=t.getAttribute('data-a'), id=t.getAttribute('data-id'), v=t.getAttribute('data-v'), i=+t.getAttribute('data-i');
  if(ui.editing&&a!=='cancel-edit')readEditor();
  if(ui.view==='painel'&&ui.tab==='config'&&!ui.editing)readSettings();
  var p, wasFree;
  if(cxAction(a,id,v,t)){render();return;}
  switch(a){
    case 'cat':ui.cat=id;break;
    case 'f-size':ui.fSize=ui.fSize===v?null:v;break;
    case 'f-color':ui.fColor=normCor(ui.fColor)===normCor(v)?null:v;ui.fColorOpen=false;break;
    case 'f-colors':ui.fColorOpen=!ui.fColorOpen;break;
    case 'f-clear':ui.fSize=null;ui.fColor=null;ui.fColorOpen=false;break;
    case 'open-product':ui.anim=true;ui.nsent=false;ui.ncode=null;ui.err={};ui.product=id;ui.img=0;ui.color=null;ui.size=null;ui.qty=1;p=prodById(id);
      if(p&&p.colors.length===1&&colorOk(p,p.colors[0].name))ui.color=p.colors[0].name;
      if(p&&p.sizes.length===1&&sizeOk(p,p.sizes[0]))ui.size=p.sizes[0];
      if(p&&ui.fColor){var fc=p.colors.find(function(c){return normCor(c.name)===normCor(ui.fColor);});if(fc)ui.color=fc.name;}
      if(p&&ui.fSize&&p.sizes.indexOf(ui.fSize)>=0&&stockOf(p,ui.color,ui.fSize)>0)ui.size=ui.fSize;break;
    case 'close-product':ui.product=null;ui.chartOpen=false;break;
    case 'open-chart':ui.chartOpen=true;break;
    case 'close-chart':ui.chartOpen=false;break;
    case 'rm-chart':var cc=state.categories.find(function(c){return c.id===id;});if(cc)delete cc.sizeChart;break;
    case 'img':ui.img=i;break;
    case 'color':ui.color=v;ui.qty=1;ui.nsent=false;ui.ncode=null;ui.err={};break;
    case 'size':ui.size=v;ui.qty=1;ui.nsent=false;ui.ncode=null;ui.err={};break;
    case 'notify-send':
      if(buyer.name.trim().split(/\s+/).filter(function(w){return w.length>1;}).length<2){ui.err.notify='Escreva seu nome completo, com nome e sobrenome.';break;}
      var npd=String(buyer.phone).replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');
      if(npd.length<10||npd.length>11){ui.err.notify='Informe seu WhatsApp com DDD, por exemplo (85) 99999-9999.';break;}
      ui.err={};ui.nbusy=true;render();api('avise-me',{pid:ui.product,color:ui.color||'',size:ui.size||'',name:buyer.name,phone:buyer.phone}).then(function(){ui.nbusy=false;ui.nsent=true;saveBuyer();render();}).catch(function(e2){ui.nbusy=false;ui.err.notify=e2.message||'Não deu para registrar. Tente de novo.';render();});return;
    case 'parse-alert':var at=document.getElementById('a-text');ui.alertText=at?at.value:'';ui.aparsed=ui.alertText.trim()?parseAlert(ui.alertText):{error:'Cole a mensagem do cliente primeiro.'};ui.msg='';break;
    case 'save-alert':saveAlert();return;
    case 'cancel-alert':ui.aparsed=null;ui.alertText='';break;
    case 'a-filter':ui.afilter=v;break;
    case 'alert-sent':if(db)db.doc('avisos/'+id).update({status:'avisado',notifiedAt:stamp()}).catch(function(){});return;
    case 'del-alert':ui.confirmDel=null;if(db)db.doc('avisos/'+id).delete().catch(function(){ui.msg='Não deu para apagar o aviso.';render();});break;
    case 'qty':ui.qty+=(+t.getAttribute('data-d'));clampQty();break;
    case 'add':
      p=prodById(ui.product);if(!p)break;
      if(avail(p,ui.color,ui.size)<ui.qty){toast('Não temos essa quantidade disponível.');break;}
      wasFree=isFree();

    case 'open-cart':ui.anim=true;ui.cartOpen=true;if(cart.length)ui.sent=false;ui.err={};break;
    case 'close-cart':ui.cartOpen=false;if(!cart.length)ui.sent=false;break;

    case 'go-login':if(canEdit){ui.view='painel';ui.tab='pedidos';}else ui.view='login';ui.msg='';window.scrollTo(0,0);break;
    case 'login-go':doLogin();return;
    case 'np-save':var npw=(document.getElementById('np-pass')||{}).value||'';if(npw.length<8){ui.err.np='A senha precisa ter pelo menos 8 caracteres.';break;}sbc.auth.updateUser({password:npw}).then(function(r){if(r.error){ui.err.np=r.error.message;render();return;}ui.view='painel';ui.msg='Senha atualizada.';render();});return;
    case 'login-mode':ui.loginMode=v;ui.err={};ui.loginInfo='';break;
    case 'logout':sbc.auth.signOut().then(function(){location.href=location.pathname;});return;
    case 'team-add':var te=((document.getElementById('tm-email')||{}).value||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(te)){ui.err.team='Digite um e-mail válido.';break;}ui.err={};sbc.from('equipe').insert({email:te}).then(function(r){if(r.error&&!/duplicate/i.test(r.error.message)){ui.err.team='Não deu para adicionar: '+r.error.message;render();return;}ui.msg=te+' agora tem acesso ao Painel. Ela entra em “Área da equipe” → “Primeiro acesso”.';loadTeam();render();});return;

    case 'copy':
      var txt=ui.sentText||orderText();
      try{navigator.clipboard.writeText(txt).then(function(){toast('Mensagem copiada');},function(){selectMsg();});}catch(e){selectMsg();}
      return;
    case 'clear-cart':cart=[];saveCart();ui.sent=false;ui.cartOpen=false;toast('Carrinho esvaziado');break;
    case 'go-admin':ui.view='painel';ui.tab='pedidos';ui.msg='';window.scrollTo(0,0);break;
    case 'go-store':ui.view='loja';ui.editing=null;window.scrollTo(0,0);break;
    case 'tab':ui.tab=v;ui.confirmDel=null;ui.err={};ui.msg='';break;
    case 'publish':publish();return;
    case 'discard':state=clone(SAVED);ui.editing=null;ui.parsed=null;ui.msg='Alterações descartadas.';break;
    case 'parse-order':var ot=document.getElementById('o-text');ui.orderText=ot?ot.value:'';ui.parsed=ui.orderText.trim()?parseOrder(ui.orderText):{error:'Cole a mensagem do pedido primeiro.'};ui.msg='';break;
    case 'cancel-parse':ui.parsed=null;ui.orderText='';break;
    case 'register-order':registerOrder();return;
    case 's-cat':ui.scat=v;ui.openStock=null;break;
    case 'st-view':ui.stockView=v;break;
    case 'st-catalog':openCatalog(ui.scat||'all');return;
    case 'st-csv':stockCsv(ui.scat||'all');return;
    case 'st-print':document.body.classList.add('printing-report');window.print();setTimeout(function(){document.body.classList.remove('printing-report');},500);return;
    case 'st-toggle':ui.openStock=ui.openStock===id?null:id;break;
    case 'fin-mode':ui.fin={mode:v,off:0};break;
    case 'fin-nav':ui.fin.off=Math.min(0,ui.fin.off+(+v));break;
    case 'save-goals':saveGoals();return;
    case 'o-filter':ui.ofilter=v;ui.confirmCancel=null;break;
    case 'o-askcancel':ui.confirmCancel=id;break;
    case 'o-nocancel':ui.confirmCancel=null;break;
    case 'o-cancel':cancelOrder(id);return;
    case 'o-status':setStatus(id,v);return;
    case 'c-toggle':ui.openClient=ui.openClient===id?null:id;ui.confirmCancel=null;break;
    case 'new-product':ui.editing={cost:'',id:uid('p'),name:'',categoryId:ui.cat!=='all'?ui.cat:(state.categories[0]&&state.categories[0].id)||null,price:'',salePrice:'',desc:'',colors:[],sizes:['P','M','G','GG'],images:[],active:true,trackStock:true,stock:{}};ui.err={};ui.msg='';window.scrollTo(0,0);break;
    case 'edit-product':ui.editing=clone(prodById(id));ui.editing.cost=costOf(id);loadStoredPhotos(id);ui.err={};ui.msg='';window.scrollTo(0,0);break;
    case 'cancel-edit':ui.editing=null;ui.err={};break;
    case 'ask-del':ui.confirmDel=id;break;
    case 'cancel-del':ui.confirmDel=null;break;
    case 'del-product':state.products=state.products.filter(function(p){return p.id!==id;});cart=cart.filter(function(l){return l.pid!==id;});saveCart();ui.confirmDel=null;publish('Produto apagado da loja.');return;
    case 'rm-logo':state.settings.logo='';break;
    case 'del-examples':state.products=state.products.filter(function(p){return !p.example;});break;
    case 'toggle-active':var pp=prodById(id);pp.active=!pp.active;publish(pp.active?'Produto visível na loja.':'Produto ocultado da loja.');return;
    case 'add-color':
      var nn=document.getElementById('nc-name').value.trim(), hx=document.getElementById('nc-hex').value;
      if(!nn){ui.err.edit='Dê um nome para a cor antes de adicionar.';break;}
      if(ui.editing.colors.some(function(c){return c.name.toLowerCase()===nn.toLowerCase();})){ui.err.edit='Essa cor já está na lista.';break;}
      ui.editing.colors.push({name:nn,hex:hx});ui.err={};break;
    case 'rm-color':ui.editing.colors.splice(i,1);break;
    case 'toggle-size':var s=ui.editing.sizes,k=s.indexOf(v);if(k>=0)s.splice(k,1);else s.push(v);
      var order=['PP','P','M','G','GG','XG','XGG'];s.sort(function(x,y){var a1=order.indexOf(x),b1=order.indexOf(y);return (a1<0?99:a1)-(b1<0?99:b1);});break;
    case 'add-size':var ns=document.getElementById('ns').value.trim();if(ns&&ui.editing.sizes.indexOf(ns)<0)ui.editing.sizes.push(ns);break;
    case 'img-first':var im=ui.editing.images.splice(i,1)[0];ui.editing.images.unshift(im);break;
    case 'photo-restore':if(ui.editing&&ui.editing.images.indexOf(v)<0)ui.editing.images.push(v);break;
    case 'img-rm':ui.editing.images.splice(i,1);break;
    case 'save-product':
      var e=ui.editing, pr=num(e.price), sp=num(e.salePrice);
      if(!String(e.name||'').trim()){ui.err.edit='Dê um nome ao produto.';break;}
      if(pr==null||isNaN(pr)||pr<=0){ui.err.edit='Informe um preço válido, por exemplo 59,90.';break;}
      if(sp!=null&&(isNaN(sp)||sp>=pr)){ui.err.edit='O preço de promoção precisa ser menor que o preço normal.';break;}
      var stock={};
      if(e.trackStock){(e.colors.length?e.colors.map(function(c){return c.name;}):['']).forEach(function(c){(e.sizes.length?e.sizes:['']).forEach(function(s){var key=skey(c,s);stock[key]=Math.max(0,parseInt(e.stock&&e.stock[key],10)||0);});});}
      var cst=num(e.cost);if(cst!=null&&(isNaN(cst)||cst<0)){ui.err.edit='Informe um preço de custo válido, por exemplo 25,00.';break;}
      if(db&&cst!==costOf(e.id)){var nc=Object.assign({},costs);if(cst==null)delete nc[e.id];else nc[e.id]=cst;costs=nc;db.doc('privado/custos').set(nc).catch(function(err){ui.msg='O produto foi salvo, mas o preço de custo não'+(err&&err.code?' ('+err.code+')':'')+'. Tente salvar de novo.';render();});}
      else if(!db&&cst!=null){ui.err.edit='Entre com o login da equipe para salvar o preço de custo.';break;}
      var out={id:e.id,name:e.name.trim(),categoryId:e.categoryId||null,price:pr,salePrice:sp,desc:e.desc||'',colors:e.colors,sizes:e.sizes,images:e.images,active:!!e.active,trackStock:!!e.trackStock,stock:stock};
      var idx=state.products.findIndex(function(p){return p.id===e.id;});
      if(idx>=0)state.products[idx]=out;else state.products.unshift(out);
      ui.editing=null;ui.err={};ui.storedPhotos=null;publish('Produto salvo e publicado na loja.');return;
    case 'add-cat':
      var cn=document.getElementById('new-cat').value.trim();
      if(!cn){ui.err.cat='Escreva o nome da categoria.';break;}
      state.categories.push({id:uid('c'),name:cn});ui.err={};break;
    case 'del-cat':state.categories=state.categories.filter(function(c){return c.id!==id;});state.products.forEach(function(p){if(p.categoryId===id)p.categoryId=null;});ui.confirmDel=null;if(ui.cat===id)ui.cat='all';break;
    default:return;
  }
  render();
});
function selectMsg(){var b=document.getElementById('msgbox');if(!b)return;var r=document.createRange();r.selectNodeContents(b);var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast('Mensagem selecionada. Copie com o menu do aparelho.');}

app.addEventListener('input',function(ev){
  var t=ev.target,id=t.id;
  if(id==='search'){ui.q=t.value;render();return;}
  if(id==='o-text'){ui.orderText=t.value;return;}
  if(id==='a-text'){ui.alertText=t.value;return;}
  if((id==='e-cost'||id==='e-price'||id==='e-sale')&&ui.editing){readEditor();var mg=document.getElementById('e-margin');if(mg)mg.innerHTML=marginText(ui.editing);return;}
  if(id==='c-search'){ui.cq=t.value;render();return;}
  if(id==='b-name'||id==='b-phone'||id==='b-address'||id==='b-ref'||id==='b-obs'){buyer[{'b-name':'name','b-phone':'phone','b-address':'address','b-ref':'ref','b-obs':'obs'}[id]]=t.value;saveBuyer();ui.err={};var e=app.querySelector('.checkout .err, .notify .err');if(e)e.remove();return;}
  if(t.dataset.cat){var c=state.categories.find(function(c){return c.id===t.dataset.cat;});if(c&&t.value.trim())c.name=t.value.trim();refreshStatus();return;}
  if(id&&id.indexOf('s-')===0){readSettings();refreshStatus();return;}
});
app.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.name==='mode'){buyer.mode=t.value;saveBuyer();render();return;}
  if(t.name==='metodo'){buyer.metodo=t.value;saveBuyer();ui.err={};render();return;}
  if(t.id==='imp-file'&&t.files&&t.files[0]){importFile(t.files[0]);return;}
  if(t.id==='b-pay'){buyer.pay=t.value;saveBuyer();return;}
  if(t.id==='s-delivery'){readSettings();refreshStatus();return;}
  if(t.id==='e-track'){readEditor();render();return;}
  if(t.dataset&&t.dataset.chartcat&&t.files&&t.files[0]){
    var cid=t.dataset.chartcat, fr=new FileReader();
    fr.onload=function(){var img=new Image();img.onload=function(){var k=Math.min(1,1400/img.width);var cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
      var u=cv.toDataURL('image/webp',0.85);if(u.indexOf('data:image/webp')!==0)u=cv.toDataURL('image/jpeg',0.85);var cc=state.categories.find(function(c){return c.id===cid;});if(cc)cc.sizeChart=u;ui.msg='Tabela de medidas adicionada. Toque em “Publicar alterações” para aparecer na loja.';render();};img.src=fr.result;};
    fr.readAsDataURL(t.files[0]);return;
  }
  if(t.id==='s-logo'&&t.files&&t.files[0]){
    readSettings();var r=new FileReader();
    r.onload=function(){var img=new Image();img.onload=function(){var max=400,k=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var u=c.toDataURL('image/webp',0.88);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/png');state.settings.logo=u;ui.msg='Logomarca trocada. Toque em “Publicar alterações” para aparecer na loja.';render();};img.src=r.result;};
    r.readAsDataURL(t.files[0]);return;
  }
  if(t.id==='e-files'&&t.files&&t.files.length){
    readEditor();var files=[].slice.call(t.files);ui.loadingImg=true;render();
    Promise.all(files.map(function(f){return compress(f).catch(function(){return null;});})).then(function(list){
      var pid=ui.editing&&ui.editing.id;
      Promise.all(list.map(function(d){return d?uploadEditorPhoto(d,pid):null;})).then(function(urls){
        urls.forEach(function(u){if(u&&ui.editing&&ui.editing.id===pid)ui.editing.images.push(u);});
        ui.loadingImg=false;if(list.some(function(d){return !d;}))ui.err.edit='Uma das fotos não pôde ser lida. Tente outra imagem (JPG ou PNG).';
        if(pid)loadStoredPhotos(pid);render();
      });
    });
  }
});
function refreshStatus(){
  var st=app.querySelector('.status');if(!st)return;var d=dirty();
  st.classList.toggle('dirty',d);st.lastChild.textContent=d?'Alterações ainda não publicadas':'Tudo publicado';
  var pb=app.querySelector('[data-a="publish"]');if(pb)pb.disabled=!d||ui.publishing;
  var bar=app.querySelector('.abar .radios');if(bar&&d&&!bar.querySelector('[data-a="discard"]')){var b=document.createElement('button');b.className='btn sm ghost';b.setAttribute('data-a','discard');b.textContent='Descartar';bar.insertBefore(b,bar.firstChild);}
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&ui.view==='login'&&e.target&&(e.target.id==='lg-email'||e.target.id==='lg-pass')){doLogin();return;}if(e.key!=='Escape')return;if(ui.chartOpen){ui.chartOpen=false;render();return;}if(ui.product||ui.cartOpen){ui.product=null;ui.cartOpen=false;render();}});

render();

window.addEventListener('beforeunload',function(e){if(canEdit&&dirty()){e.preventDefault();e.returnValue='';}});
(function boot(){
  var qs=new URLSearchParams(location.search), retCode=(qs.get('pedido')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(location.hash==='#painel')ui.view='login';
  api('config').then(function(c){
    PAY_ONLINE=!!c.pagamentoOnline;PAY_ENV=c.ambientePagamento||'';
    if(!PAY_ONLINE)buyer.metodo='whatsapp';
    if(!c.supabaseUrl||!c.supabaseAnonKey)throw new Error('config');
    sbc=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    sbc.auth.onAuthStateChange(function(ev,session){if(ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED'||ev==='INITIAL_SESSION'){if(session&&!canEdit)afterAuth(session);}if(ev==='PASSWORD_RECOVERY'){ui.view='senha';render();}});
    return fetchStore();
  }).then(function(fresh){
    SAVED=fresh;state=clone(fresh);storeLoaded=true;
    cart=cart.filter(function(l){return state.products.some(function(p){return p.id===l.pid&&p.active!==false;});});
    if(retCode)startReturn(retCode);
    render();
    return sbc.auth.getSession();
  }).then(function(r){var ss=r&&r.data&&r.data.session;if(ss)afterAuth(ss);else if(ui.view==='login')render();})
  .catch(function(e){console.error(e);storeError='A loja não conseguiu carregar agora. Atualize a página em instantes.';storeLoaded=false;render();});
})();
})();
</script>
